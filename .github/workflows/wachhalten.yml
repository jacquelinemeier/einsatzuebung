# Hält das kostenlose Supabase-Projekt wach (wird sonst nach ca. 1 Woche ohne Nutzung pausiert).
# Läuft automatisch alle 3 Tage. Kann unter „Actions“ auch von Hand gestartet werden.
name: Supabase wach halten
on:
  schedule:
    - cron: '17 5 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Supabase anfragen
        run: |
          URL=$(grep -o "supabaseUrl: *'[^']*'" config.js | sed "s/.*'\(.*\)'/\1/")
          KEY=$(grep -o "supabaseKey: *'[^']*'" config.js | sed "s/.*'\(.*\)'/\1/")
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
          echo " – Supabase ist wach."
