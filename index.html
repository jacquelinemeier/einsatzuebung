.list-body { overflow-y: auto; flex: 1; padding: 0 8px 12px; }
.list-sep { padding: 10px 6px 6px; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); font-weight: 700; }
.li { display: grid; grid-template-columns: 48px 1fr; gap: 10px; align-items: start; padding: 9px 8px; border-radius: 9px; cursor: pointer; }
.li:hover { background: var(--sunken); }
.li.sel { background: var(--accent-bg); }
.li.done { opacity: .55; }
.li .code { font-family: var(--mono); font-weight: 700; font-size: 13px; text-align: center; padding: 5px 0; border-radius: 6px; }
.fam-B .code, .code.fam-B { background: var(--fam-B-bg); color: var(--fam-B); }
.fam-TH .code, .code.fam-TH { background: var(--fam-TH-bg); color: var(--fam-TH); }
.fam-RD .code, .code.fam-RD { background: var(--fam-RD-bg); color: var(--fam-RD); }
.li .c { min-width: 0; display: grid; gap: 1px; }
.li .t { display: flex; justify-content: space-between; gap: 6px; font-weight: 650; }
.li .t .tab { font-weight: 500; color: var(--ink2); font-size: 13px; }
.li .a { color: var(--ink2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .m { color: var(--ink2); font-size: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
.li .warn { color: var(--danger); font-weight: 600; }
.empty { padding: 26px 14px; color: var(--ink2); text-align: center; line-height: 1.5; font-size: 14px; }

/* ---------- Einsatz ---------- */
.view { position: relative; overflow: hidden; min-width: 0; }
.details { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; }
.d-top { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; padding: 14px 18px 10px; background: var(--surface); border-bottom: 1px solid var(--line); }
.hd-code { font-family: var(--mono); font-weight: 800; font-size: 20px; padding: 10px 12px; border-radius: 10px; min-width: 64px; text-align: center; }
.hd-code.fam-B { background: var(--fam-B-bg); color: var(--fam-B); }
.hd-code.fam-TH { background: var(--fam-TH-bg); color: var(--fam-TH); }
.hd-code.fam-RD { background: var(--fam-RD-bg); color: var(--fam-RD); }
.hd-main { min-width: 0; }
.hd-main h2 { margin: 0; font-size: 22px; line-height: 1.2; text-wrap: balance; }
.hd-main p { margin: 2px 0 0; color: var(--ink2); font-size: 14.5px; }
.hd-meta { display: grid; grid-template-columns: repeat(4, auto); gap: 4px 18px; margin: 0; }
.hd-meta div { display: grid; }
.hd-meta dt { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink2); font-weight: 700; }
.hd-meta dd { margin: 0; font-size: 15.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.hd-meta dd.run { color: var(--st1); }
.d-tabs { display: flex; gap: 4px; padding: 0 14px; background: var(--surface); border-bottom: 1px solid var(--line); overflow-x: auto; }
.d-tabs button { padding: 10px 12px; font-size: 14.5px; font-weight: 600; color: var(--ink2); border-bottom: 2.5px solid transparent; position: relative; white-space: nowrap; }
.d-tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
.d-tabs button:hover { color: var(--ink); }
.badge { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; margin-left: 6px; border-radius: 99px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; vertical-align: 1px; }
.d-body { flex: 1; display: grid; grid-template-columns: 1fr 320px; min-height: 0; }
.d-main { padding: 14px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; min-width: 0; }
.d-facts { display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.d-facts > div { padding: 10px 14px; border-left: 1px solid var(--line); min-width: 0; }
.d-facts > div:first-child { border-left: 0; }
.lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink2); font-weight: 700; }
.f-street { font-size: 18px; font-weight: 650; margin-top: 2px; }
.f-sub { color: var(--ink2); font-size: 14px; }
.f-obj { display: inline-block; margin-top: 4px; font-size: 12.5px; font-weight: 700; color: var(--fam-B); background: var(--fam-B-bg); border-radius: 5px; padding: 1px 7px; }
.folge { display: flex; align-items: center; gap: 4px; margin-top: 4px; font-family: var(--mono); font-weight: 700; }
.folge span { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; background: var(--sunken); border: 1px solid var(--line); }
.folge span:first-child { background: var(--ink); color: #fff; border-color: var(--ink); }
.folge i { color: var(--ink2); font-style: normal; font-size: 12px; }
.f-le { font-size: 15px; font-weight: 600; margin-top: 4px; }
.mapwrap { position: relative; flex: 1; min-height: 320px; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); }
.map { position: absolute; inset: 0; background: #dfe5ea; }
.layerseg { position: absolute; top: 10px; left: 10px; z-index: 500; display: flex; background: rgba(255,255,255,.96); border-radius: 8px; padding: 3px; box-shadow: 0 1px 4px rgba(0,0,0,.18); }
.layerseg button { padding: 5px 11px; border-radius: 6px; font-size: 13.5px; font-weight: 600; color: var(--ink2); }
.layerseg button.on { background: var(--ink); color: #fff; }
.leaflet-top.leaflet-left { top: 46px; }
.mapnote { position: absolute; left: 10px; bottom: 10px; z-index: 500; background: rgba(255,255,255,.96); padding: 6px 10px; border-radius: 8px; font-size: 12px; color: var(--ink2); max-width: 72%; }
.d-stats { display: block; }
.lastlage { display: grid; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: var(--r); padding: 10px 14px; cursor: pointer; text-align: left; width: 100%; }
.lastlage p { margin: 0; font-size: 15px; line-height: 1.4; }
.lastlage em { font-style: normal; color: var(--accent); font-size: 13.5px; font-weight: 600; }

.d-side { border-left: 1px solid var(--line); background: var(--surface); padding: 14px 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.d-side h3 { margin: 0; font-size: 15px; display: flex; justify-content: space-between; align-items: baseline; }
.d-side h3 span { color: var(--ink2); font-weight: 500; font-size: 13px; }
.em { display: grid; gap: 4px; }
.em-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
.em-row:hover { background: var(--sunken); border-color: var(--line); }
.em-row .n { min-width: 0; display: grid; }
.em-row .n b { font-size: 14.5px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.em-row .n small { font-size: 12px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.em-row.left { opacity: .45; }
.em-row.miss .n b { color: var(--danger); }
.em-row.sub { margin-left: 22px; padding-top: 4px; padding-bottom: 4px; }
.em-row.sub .n b { font-size: 13.5px; font-weight: 600; }
.odot { width: 8px; height: 8px; border-radius: 50%; }
.odot.BF { background: var(--org-BF); } .odot.FU { background: var(--org-FU); } .odot.RD { background: var(--org-RD); } .odot.FF { background: var(--org-FF); }
.st { display: inline-grid; place-items: center; font-family: var(--mono); font-weight: 700; font-size: 12.5px; color: #fff; border-radius: 6px; min-width: 24px; height: 24px; padding: 0 5px; background: var(--st6); }
.st.s1 { background: var(--st1); } .st.s2 { background: var(--st2); } .st.s3 { background: var(--st3); } .st.s4 { background: var(--st4); }
.st.s6 { background: var(--st6); } .st.s7 { background: var(--st7); } .st.s8 { background: var(--st8); } .st.sA { background: var(--stA); animation: blink 1s steps(2) infinite; }
.st.sx { background: transparent; color: var(--ink2); border: 1px dashed var(--line); }
@keyframes blink { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { .st.sA, .pill.off { animation: none; } }
.actions { display: grid; gap: 8px; }
.actions .btn { width: 100%; padding: 10px; }
.confirm { background: #fff5f5; border: 1px solid #f1c0bd; border-radius: 9px; padding: 10px; display: grid; gap: 8px; font-size: 14px; }
.confirm .row { display: flex; gap: 8px; }
.confirm .row .btn { flex: 1; }
.hint { font-size: 13px; color: var(--ink2); line-height: 1.45; }

/* ---------- Lagekarte / Fahrzeuge ---------- */
.full { position: absolute; inset: 0; }
.full .map { border-radius: 0; }
.fleet { position: absolute; inset: 0; overflow-y: auto; padding: 16px 18px 30px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); grid-auto-rows: max-content; gap: 12px; align-content: start; align-items: start; }
.fleet .grp { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.fleet .grp h4 { border-radius: var(--r) var(--r) 0 0; }
.fleet .grp h4 { margin: 0; padding: 9px 12px; font-size: 13.5px; background: var(--sunken); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
.fleet .grp h4 span { color: var(--ink2); font-weight: 500; white-space: nowrap; }
.fleet .fv { display: grid; grid-template-columns: auto 1fr; align-items: center; padding: 6px 12px; border-top: 1px solid #edf0f3; font-size: 14px; column-gap: 10px; cursor: pointer; }
.fleet .fv:first-of-type { border-top: 0; }
.fleet .fv:hover { background: var(--sunken); }
.fleet .fv .x { color: var(--ink2); font-size: 12px; grid-column: 2; }
.legend { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; color: var(--ink2); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- Karten-Marker ---------- */
.mk-inc { width: 30px; height: 30px; border-radius: 8px; transform: rotate(45deg); background: var(--fam-B); border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35); display: grid; place-items: center; }
.mk-inc svg { width: 14px; height: 14px; fill: #fff; transform: rotate(-45deg); }
.mk-inc.th { background: var(--fam-TH); }
.mk-inc.rd { background: var(--fam-RD); }
.mk-inc.done { background: #868e96; }
.mk-veh { font-family: var(--mono); font-size: 10px; font-weight: 700; color: #fff; padding: 2px 5px; border-radius: 4px; white-space: nowrap; box-shadow: 0 1px 3px rgba(0,0,0,.4); transform: translate(-50%, -50%); display: inline-block; }
.mk-site { font-size: 10px; font-weight: 700; background: var(--bar); color: #fff; padding: 2px 5px; border-radius: 4px; white-space: nowrap; transform: translate(-50%, -50%); display: inline-block; }
.mk-site.le { background: var(--org-FF); }
.leaflet-div-icon { background: none; border: 0; }

/* ---------- Dialoge ---------- */
.ov { position: fixed; inset: 0; z-index: 80; background: rgba(15,22,29,.45); display: flex; }
.sheet { background: var(--bg); margin: auto; width: min(580px, 94vw); max-height: 88vh; border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 16px 50px rgba(0,0,0,.3); }
.sheet.right { margin: 0 0 0 auto; height: 100%; max-height: none; border-radius: 0; width: min(430px, 100vw); }
.sheet-h { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.sheet-h b { font-size: 17px; }
.sheet-h .btn { background: var(--sunken); color: var(--ink); border: 1px solid var(--line); }
.sheet-b { padding: 14px 16px 20px; overflow-y: auto; display: grid; gap: 14px; }
.fld { display: grid; gap: 6px; }
.fld > label { font-size: 13px; color: var(--ink2); font-weight: 600; }
.fld select, .fld input[type=text], .fld input[type=number], .fld textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-size: 16px; }
.fld textarea { resize: vertical; }
.grp2 { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 12px; }
.grp2 h5 { margin: 0; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.switch input { width: 48px; height: 28px; appearance: none; background: #cdd5dc; border-radius: 99px; position: relative; cursor: pointer; transition: background .15s; flex: none; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { left: 23px; }
.range { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
.range input { width: 100%; accent-color: var(--accent); }
.range b { font-family: var(--mono); min-width: 5ch; text-align: right; }
.mix { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.mix label { display: grid; gap: 3px; font-size: 12px; color: var(--ink2); text-align: center; }
.mix input { width: 100%; padding: 6px 4px; border: 1px solid var(--line); border-radius: 7px; text-align: center; font-size: 15px; }
.minimap { height: 220px; border-radius: 9px; border: 1px solid var(--line); position: relative; }
.kgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 8px; }
.kgrid button { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px; text-align: left; display: grid; gap: 2px; }
.kgrid button:hover { border-color: var(--accent); }
.kgrid button b { font-size: 15px; }
.kgrid button span { font-size: 12px; color: var(--ink2); }
.kgrid button:disabled { opacity: .45; }
.logl { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.logl div { display: grid; grid-template-columns: 70px 1fr; gap: 8px; padding: 8px 12px; border-top: 1px solid #edf0f3; font-size: 14px; }
.logl div:first-child { border-top: 0; }
.logl time { font-family: var(--mono); font-size: 13px; color: var(--ink2); }
.logl .lage { background: #fff9db; font-weight: 600; }
.logl .warn { color: var(--danger); }
.logl .alarm { color: #8a4b00; }
.logl .ff { background: #f3effb; }
.logl .foto { background: var(--accent-bg); font-weight: 600; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.gallery button { display: grid; gap: 4px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px; }
.gallery img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px; background: #ddd; }
.gallery span { font-size: 13px; color: var(--ink2); }
.photo-big { width: 100%; max-height: 70vh; object-fit: contain; border-radius: 8px; background: #111; }
#fotoPrev { max-width: 100%; max-height: 180px; border-radius: 8px; object-fit: contain; background: #eee; }

/* ---------- Abschnitte (Baum) ---------- */
.ab { position: fixed; inset: 0; z-index: 70; background: var(--bg); display: grid; grid-template-rows: auto 1fr; }
.ab-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; background: var(--surface); border-bottom: 1px solid var(--line); }
.ab-title { display: grid; }
.ab-title b { font-size: 18px; }
.ab-title span { font-size: 13px; color: var(--ink2); }
.ab-actions { display: flex; gap: 8px; }
.ab-actions .btn:not(.primary) { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.ab-wrap { display: grid; grid-template-columns: 1fr 300px; min-height: 0; }
.ab-board { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.node { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 8px; }
.node.el { border-top: 4px solid var(--ink); }
.node.ea { border-left: 4px solid var(--accent); }
.node.eua { border-left: 4px solid #9fb4c4; }
.nh { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.nh .nlabel { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--ink2); background: var(--sunken); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
.nh b { font-size: 16px; }
.nh .rg { font-size: 12.5px; color: var(--ink2); }
.nh .lnk { margin-left: auto; color: var(--accent); font-weight: 600; font-size: 13.5px; }
.nrow { display: grid; grid-template-columns: 190px 1fr; gap: 8px; }
.lead { border: 1.5px dashed #b9c6d1; border-radius: 8px; padding: 6px; min-height: 44px; display: flex; align-items: center; gap: 6px; background: var(--sunken); }
.lead .ph { font-size: 12.5px; color: var(--ink2); }
.drop { border: 1.5px solid #d4dce3; border-radius: 8px; padding: 6px; min-height: 44px; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; background: #fbfcfd; }
.drop .ph { font-size: 12.5px; color: #9aa7b3; align-self: center; padding: 0 4px; }
.children { display: grid; gap: 8px; margin-left: 22px; padding-left: 12px; border-left: 2px solid #c9d4dd; }
.addnode { align-self: flex-start; border: 1.5px dashed #9fb4c4; color: var(--ink2); border-radius: 8px; padding: 8px 14px; font-weight: 600; }
.hot { outline: 3px solid var(--accent); outline-offset: -2px; background: var(--accent-bg) !important; }
.tray { border-left: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.tray .zone { display: flex; flex-direction: column; min-height: 0; }
.tray .zone:first-child { flex: 1; }
.tray .zl { padding: 10px 12px 6px; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); font-weight: 700; }
.tray .zone .cards { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 12px 12px; align-content: flex-start; overflow-y: auto; }
.tray .zone:first-child .cards { flex: 1; }
.tray .zone.leftz { border-top: 1px solid var(--line); background: var(--sunken); max-height: 34%; }
.vcard { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px 4px 4px; border-radius: 7px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--org-BF); font-size: 13.5px; font-weight: 600; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; max-width: 100%; }
.vcard .st { min-width: 20px; height: 20px; font-size: 11px; }
.vcard .vn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vcard.FU { border-left-color: var(--org-FU); } .vcard.RD { border-left-color: var(--org-RD); } .vcard.FF { border-left-color: var(--org-FF); }
.vcard.sel { box-shadow: 0 0 0 3px var(--accent); }
.vcard.ghost { position: fixed; z-index: 200; pointer-events: none; opacity: .92; box-shadow: 0 10px 24px rgba(0,0,0,.3); }
.vcard.dragging { opacity: .3; }
.lead .vcard { flex: 1; }
.menu { position: fixed; z-index: 90; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.2); width: 320px; overflow: hidden; }
.menu .mh { padding: 10px 14px 6px; font-size: 12px; color: var(--ink2); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.menu button { display: grid; width: 100%; text-align: left; padding: 10px 14px; border-top: 1px solid #edf0f3; gap: 2px; }
.menu button:hover { background: var(--sunken); }
.menu button b { font-size: 15px; }
.menu button span { color: var(--ink2); font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 300; background: var(--bar); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.3); max-width: 90vw; }

/* ---------- Rollen ---------- */
[data-role="anwender"] [data-act="open-ul"], [data-role="anwender"] [data-act="new-inc"], [data-role="anwender"] [data-act="el-open"], [data-role="anwender"] #el { display: none !important; }

@media (max-width: 1100px) {
  .d-body { grid-template-columns: 1fr 270px; }
  .hd-meta { grid-template-columns: repeat(2, auto); }
  .brandtxt small { display: none; }
}
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .app .list { display: none; }
  .app.showlist .list { display: flex; position: fixed; top: calc(54px + env(safe-area-inset-top, 0px)); bottom: 0; left: 0; width: 300px; z-index: 60; box-shadow: 4px 0 20px rgba(0,0,0,.2); }
  .details { overflow-y: auto; }
  .d-top { grid-template-columns: auto 1fr; }
  .hd-meta { grid-column: 1 / -1; grid-template-columns: repeat(4, auto); }
  .d-body { grid-template-columns: 1fr; }
  .d-side { border-left: 0; border-top: 1px solid var(--line); }
  .d-facts { grid-template-columns: 1fr; }
  .d-facts > div { border-left: 0; border-top: 1px solid var(--line); }
  .d-facts > div:first-child { border-top: 0; }
  .ab-wrap { grid-template-columns: 1fr; grid-template-rows: 1fr 220px; }
  .tray { border-left: 0; border-top: 1px solid var(--line); }
  .brandtxt { display: none; }

@media (prefers-reduced-motion: no-preference) { .zs > .now.k0 i, .zs > .now.k1 i { animation: blink 1.2s steps(2) infinite; } }
.logl .req { background: #f3efff; }

      <label>Passwort<input type="password" id="bootPw" autocomplete="current-password" required></label>
      ${err ? `<div class="boot-err">${escB(err)}</div>` : ''}
      <button class="btn" type="submit">Anmelden</button>
    </form>
    <button class="boot-link" type="button" id="bootLocal">Ohne Server starten (Einzelplatz, Notfall)</button>`);
    document.getElementById('bootLocal').onclick = () => localStart();
    document.getElementById('bootLogin').onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById('bootMail').value.trim();
      const password = document.getElementById('bootPw').value;
      msg('Anmeldung …');
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) { loginForm(/invalid/i.test(error.message) ? 'E-Mail oder Passwort falsch.' : 'Anmeldung fehlgeschlagen: ' + error.message); return; }
      afterLogin(data.session);
    };
    setTimeout(() => { const m = document.getElementById('bootMail'); if (m) m.focus(); }, 30);
  }
  function logoutBtn() { return '<button class="btn sec" type="button" id="bootOut">Abmelden</button>'; }
  function wireLogout() { const b = document.getElementById('bootOut'); if (b) b.onclick = async () => { await sb.auth.signOut(); location.reload(); }; }

  async function afterLogin(session) {
    msg('Lade Daten …');
    const uid = session.user.id;
    const { data: prof, error: pe } = await sb.from('profiles').select('name,rolle').eq('id', uid).maybeSingle();
    if (pe || !prof) { fail(pe ? 'Profil konnte nicht geladen werden: ' + pe.message : 'Für dieses Konto gibt es kein Profil. Bitte das Einrichtungs-Skript in Supabase ausführen.', logoutBtn()); wireLogout(); return; }
    const role = prof.rolle === 'leitung' ? 'leitung' : 'anwender';
    if (window.__qrLogin && role === 'leitung') { await sb.auth.signOut({ scope: 'local' }); loginForm('Dieser QR-Code gehört zu einem Leitungs-Konto und ist nicht zulässig.'); return; }
    const app = { mode: 'online', role, sb, sid: sid(), token: session.access_token, user: { id: uid, name: prof.name || session.user.email, email: session.user.email } };
    sb.auth.onAuthStateChange((ev, s) => { if (s) app.token = s.access_token; if (ev === 'SIGNED_OUT') location.reload(); });
    const { data: st, error: se } = await sb.from('stammdaten').select('code,updated_at').eq('id', 1).maybeSingle();
    if (se) { fail('Stammdaten konnten nicht geladen werden: ' + se.message, logoutBtn()); wireLogout(); return; }
    if (!st || !st.code) {
      if (role === 'leitung') { fail('Es sind noch keine Stammdaten hinterlegt. Bitte die Datei „stammdaten.js“ hochladen.', uploadForm(app) + logoutBtn()); wireUpload(app); wireLogout(); }
      else { fail('Die Übungsleitung hat noch keine Stammdaten hinterlegt. Bitte später erneut versuchen.', logoutBtn()); wireLogout(); }
      return;
    }
    app.stammAt = st.updated_at;
    startApp(app, st.code);
  }

  // ---------- Stammdaten hochladen (nur Übungsleitung bzw. Einzelplatz) ----------
  function uploadForm() {
    return `<label class="btn filebtn boot-file">Stammdaten-Datei wählen …<input type="file" id="bootStamm" accept=".js,text/javascript,text/plain"></label>`;
  }
  function wireUpload(app) {
    const inp = document.getElementById('bootStamm');
    if (!inp) return;
    inp.onchange = async () => {
      const f = inp.files && inp.files[0];
      if (!f) return;
      const code = await f.text();
      if (!checkStamm(code)) { fail('Diese Datei ist keine gültige Stammdaten-Datei.', uploadForm(app) + (app.mode === 'online' ? logoutBtn() : '')); wireUpload(app); wireLogout(); return; }
      if (app.mode === 'online') {
        msg('Speichere Stammdaten …');
        const { error } = await sb.from('stammdaten').upsert({ id: 1, code, updated_at: new Date().toISOString() });
        if (error) { fail('Speichern fehlgeschlagen: ' + error.message, uploadForm(app) + logoutBtn()); wireUpload(app); wireLogout(); return; }
        app.stammAt = new Date().toISOString();
      } else {
        try { localStorage.setItem(LOCAL_KEY, code); } catch (e) { /* nur für diese Sitzung */ }
      }
      startApp(app, code);
    };
  }

  // ---------- Einzelplatz ohne Server ----------
  function localStart(note) {
    const app = { mode: 'local', role: 'einzel', user: { id: 'lokal', name: 'Einzelplatz' } };
    let saved = null;
    try { saved = localStorage.getItem(LOCAL_KEY); } catch (e) { /* kein Speicher */ }
    show(`${note ? `<div class="boot-msg">${escB(note)}</div>` : ''}
      <div class="boot-msg">Einzelplatz: Die Übung läuft nur auf diesem Gerät, ohne Anmeldung und ohne Verbindung zu anderen Geräten.</div>
      ${saved ? '<button class="btn" type="button" id="bootSaved">Mit gespeicherten Stammdaten starten</button>' : ''}
      ${uploadForm(app)}
      ${sb ? '<button class="boot-link" type="button" id="bootBack">Zurück zur Anmeldung</button>' : ''}`);
    wireUpload(app);
    const s = document.getElementById('bootSaved'); if (s) s.onclick = () => startApp(app, saved);
    const bk = document.getElementById('bootBack'); if (bk) bk.onclick = () => loginForm();
  }

  // ---------- Los ----------
  (async () => {
    // erst starten, wenn die ganze Seite eingelesen ist (sonst fehlen die App-Teile)
    if (document.readyState === 'loading') await new Promise((r) => document.addEventListener('DOMContentLoaded', r, { once: true }));
    const configured = C && C.supabaseUrl && C.supabaseKey && !/DEIN/i.test(C.supabaseUrl + C.supabaseKey);
    if (!configured || !window.supabase) { localStart(configured ? 'Die Verbindungsbibliothek fehlt.' : 'Keine Server-Einstellungen gefunden (config.js fehlt oder ist nicht ausgefüllt).'); return; }
    try {
      sb = window.supabase.createClient(C.supabaseUrl, C.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }, realtime: { worker: true } });
      // QR-Code für Übende: #ql=… enthält die Zugangsdaten; danach sofort aus der Adresszeile entfernen
      const qm = location.hash.match(/[#&]ql=([^&]+)/);
      if (qm) {
        history.replaceState(null, '', location.pathname + location.search);
        let j = null;
        try { j = JSON.parse(decodeURIComponent(escape(atob(qm[1].replace(/-/g, '+').replace(/_/g, '/'))))); } catch (e) { j = null; }
        if (!j || !j.e || !j.p) { loginForm('Der QR-Code ist ungültig.'); return; }
        msg('Anmeldung über QR-Code …');
        try { await sb.auth.signOut({ scope: 'local' }); } catch (e) { /* egal */ }
        const r = await sb.auth.signInWithPassword({ email: j.e, password: j.p });
        if (r.error || !r.data || !r.data.session) { loginForm('Anmeldung über QR-Code fehlgeschlagen – Passwort geändert? Bitte die Übungsleitung fragen.'); return; }
        window.__qrLogin = true;
        afterLogin(r.data.session); return;
      }
      const { data } = await sb.auth.getSession();
      if (data && data.session) afterLogin(data.session); else loginForm();
    } catch (e) { console.error(e); fail('Verbindung zum Server nicht möglich. Internet prüfen und neu laden.', '<button class="boot-link" type="button" id="bootLocal2">Ohne Server starten (Einzelplatz)</button>'); const b = document.getElementById('bootLocal2'); if (b) b.onclick = () => localStart(); }
  })();
})();
</script>

<script type="text/x-app">/* ===================================================================
   SIMULATION – Alarmierung nach AAO und Bereichsfolge, FF-Blöcke mit
   Stärke, WLF + Abrollbehälter, Rettungsdienst, Rückmeldungen.
   Kein DOM in dieser Datei.
   =================================================================== */

const R = {
  int: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  pick: (arr) => arr[Math.floor(Math.random() * arr.length)],
  skew: (a, b) => a + (b - a) * Math.pow(Math.random(), 1.6),
  jitter: (x, p) => x * (1 - p + Math.random() * 2 * p),
  chance: (p) => Math.random() < p,
};

function distKm(a, b) {
  const toRad = (d) => d * Math.PI / 180;
  const dLat = toRad(b[0] - a[0]), dLon = toRad(b[1] - a[1]);
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a[0])) * Math.cos(toRad(b[0])) * Math.sin(dLon / 2) ** 2;
  return 6371 * 2 * Math.asin(Math.sqrt(s));
}

const BEREICH_POLYS = BEREICHE.map((b) => ({ folge: b.folge, pts: b.poly.split(';').map((p) => p.split(',').map(Number)) }));
function inPoly(pt, poly) {
  const x = pt[1], y = pt[0];
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function bereichsfolge(pos) {
  for (const b of BEREICH_POLYS) if (inPoly(pos, b.pts)) return { folge: b.folge, exact: true };
  let best = null, bestD = Infinity;
  for (const b of BEREICH_POLYS) for (const p of b.pts) { const d = distKm(pos, [p[1], p[0]]); if (d < bestD) { bestD = d; best = b; } }
  return { folge: best.folge, exact: false };
}

// ---------- Straßenrouting (OSRM: FOSSGIS-Server, Ersatz OSRM-Demo) ----------
// Ohne Internet fahren die Fahrzeuge wie bisher auf direktem Weg.
const ROUTERS = ['https://routing.openstreetmap.de/routed-car/route/v1/driving/', 'https://router.project-osrm.org/route/v1/driving/'];
async function osrmRoute(a, b) {
  for (const base of ROUTERS) {
    const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const tm = ctl ? setTimeout(() => ctl.abort(), 6000) : null;
    try {
      const r = await fetch(`${base}${a[1].toFixed(6)},${a[0].toFixed(6)};${b[1].toFixed(6)},${b[0].toFixed(6)}?overview=full&geometries=geojson`, ctl ? { signal: ctl.signal } : {});
      if (!r.ok) continue;
      const j = await r.json();
      const rt = j && j.routes && j.routes[0];
      if (!rt || !rt.geometry || rt.geometry.coordinates.length < 2) continue;
      return { path: rt.geometry.coordinates.map((c) => [c[1], c[0]]), dist: rt.distance };
    } catch (e) { /* nächster Dienst */ } finally { if (tm) clearTimeout(tm); }
  }
  throw new Error('kein Routing');
}

const STATUS_TEXT = { A: 'Alarmiert', 1: 'Frei über Funk', 2: 'Frei auf Wache', 3: 'Einsatz übernommen', 4: 'Am Einsatzort', 6: 'Außer Dienst', 7: 'Patient aufgenommen', 8: 'Am Zielort' };

function createSim() {
  const S = {
    now: Date.now(),
    speed: 1,
    vehicles: buildVehicles(),
    incidents: [],
    nextNr: 1260161365,
    auto: {
      fire: { on: false, perHour: 1.5, mix: Object.assign({}, DEFAULT_MIX) },
      rd: { on: false, perHour: 5.5, daycurve: true, mix: Object.assign({}, DEFAULT_RD_MIX) },
    },
    listeners: [],
  };
  // ---------- Routing ----------
  const ROUTE = { fn: typeof fetch === 'function' ? osrmRoute : null, cache: new Map(), queue: [], active: 0, fails: 0, pauseUntil: 0 };
  S.routing = null; // null = noch nicht geprüft, true = online, false = offline
  const rkey = (a, b) => `${a[0].toFixed(4)},${a[1].toFixed(4)}>${b[0].toFixed(4)},${b[1].toFixed(4)}`;
  function requestRoute(from, to, cb) {
    if (!ROUTE.fn || Date.now() < ROUTE.pauseUntil) return;
    const k = rkey(from, to), kr = rkey(to, from);
    if (ROUTE.cache.has(k)) { cb(ROUTE.cache.get(k)); return; }
    if (ROUTE.cache.has(kr)) { const r = ROUTE.cache.get(kr); cb({ path: r.path.slice().reverse(), dist: r.dist }); return; }
    if (ROUTE.queue.length > 80) return;
    ROUTE.queue.push({ from: from.slice(), to: to.slice(), k, cb });
    pump();
  }
  function pump() {
    while (ROUTE.active < 3 && ROUTE.queue.length) {
      const q = ROUTE.queue.shift();
      ROUTE.active++;
      Promise.resolve().then(() => ROUTE.fn(q.from, q.to)).then((r) => {
        ROUTE.fails = 0; S.routing = true;
        if (ROUTE.cache.size > 2000) ROUTE.cache.clear();
        ROUTE.cache.set(q.k, r);
        q.cb(r);
      }).catch(() => {
        ROUTE.fails++;
        if (ROUTE.fails >= 3) { S.routing = false; ROUTE.pauseUntil = Date.now() + 120000; ROUTE.queue = []; }
      }).then(() => { ROUTE.active--; setTimeout(pump, 150); });
    }
  }
  function cumDist(path) { const c = [0]; for (let i = 1; i < path.length; i++) c.push(c[i - 1] + distKm(path[i - 1], path[i])); return c; }
  // Fahrt starten: zunächst Luftlinie, sobald die Route da ist entlang der Straße
  function startTrip(v, phase, to, kmh, extra) {
    const from = v.pos.slice();
    const secs = driveSeconds(from, to, kmh);
    const job = Object.assign({ phase, from, to: to.slice(), t0: S.now, t1: S.now + secs * 1000 }, extra || {});
    v.job = job;
    requestRoute(from, to, (r) => {
      if (v.job !== job) return;
      const path = [from].concat(r.path, [to.slice()]);
      const cum = cumDist(path);
      const km = cum[cum.length - 1];
      const rsecs = Math.max(45, R.jitter((km / kmh) * 3600, 0.08));
      const f = Math.min(1, Math.max(0, (S.now - job.t0) / (job.t1 - job.t0)));
      job.path = path; job.cum = cum;
      job.t0 = S.now - f * rsecs * 1000; job.t1 = job.t0 + rsecs * 1000;
    });
    return job;
  }
  function posOnPath(j, f) {
    const total = j.cum[j.cum.length - 1];
    const d = f * total;
    let i = 1;
    while (i < j.cum.length - 1 && j.cum[i] < d) i++;
    const seg = j.cum[i] - j.cum[i - 1] || 1e-9, t = Math.min(1, Math.max(0, (d - j.cum[i - 1]) / seg));
    const a = j.path[i - 1], b = j.path[i];
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
  }

  let VMAP = new Map();
  const reindex = () => { VMAP = new Map(S.vehicles.map((v) => [v.id, v])); };
  reindex();
  const byId = (id) => VMAP.get(id);
  const incById = (id) => S.incidents.find((i) => i.id === id);
  const homeOf = (v) => (v.homePos ? v.homePos : SITES[v.site].pos);
  const initPos = () => { for (const v of S.vehicles) v.pos = homeOf(v).slice(); };
  initPos();

  function emit(type, data) { for (const f of S.listeners) try { f(type, data); } catch (e) { console.error(e); } }
  function log(inc, text, kind) { inc.log.push({ t: S.now, text, kind: kind || 'info' }); }

  // ---------- Verfügbarkeit ----------
  function onDuty(v, t) {
    if (!v.hours) return true;
    const h = new Date(t || S.now).getHours();
    return h >= v.hours[0] && h < v.hours[1];
  }
  // Frei und selbst alarmierbar (keine FF-Einzelfahrzeuge, keine Abrollbehälter)
  function isFree(v) { return !v.incidentId && (v.status === 1 || v.status === 2) && onDuty(v) && !v.parent && v.kind !== 'AB' && v.kind !== 'RTB'; }
  function ffTimeOk(code) {
    if (code === '***') return true;
    const d = new Date(S.now), day = d.getDay(), h = d.getHours();
    return day === 0 || day === 6 || h >= 18 || h < 6;
  }
  const lesByDist = (pos) => LES.slice().sort((a, b) => distKm(pos, a.pos) - distKm(pos, b.pos));
  const zustaendigeLE = (pos) => lesByDist(pos)[0];

  // ---------- Fahrzeugauswahl ----------
  function pickVehicle(kind, inc, opts) {
    opts = opts || {};
    const ex = opts.exclude || [];
    const freeOf = (k) => S.vehicles.filter((v) => v.kind === k && isFree(v) && !ex.includes(v.id));
    const near = (list, pos) => list.sort((a, b) => distKm(a.pos, pos) - distKm(b.pos, pos));

    if (kind.startsWith('WLF:')) {
      const t = kind.slice(4);
      const ab = S.vehicles.find((v) => v.kind === 'AB' && v.abType === t && !v.incidentId && !v.carriedBy);
      const wlf = near(freeOf('WLF'), inc.pos)[0];
      if (!ab || !wlf) return null;
      return { v: wlf, attach: ab };
    }
    if (kind === 'GWW') {
      const g = freeOf('GWW')[0];
      const rtb = S.vehicles.find((v) => v.kind === 'RTB' && !v.incidentId);
      if (!g) return null;
      return { v: g, attach: rtb && !rtb.carriedBy ? rtb : null };
    }
    if (kind === 'SW2000') {
      const blocks = S.vehicles.filter((v) => v.kind === 'LE' && isFree(v) && v.members.some((m) => m.includes('SW2000')));
      const b = near(blocks, inc.pos)[0];
      return b ? { v: b, force: b.members.find((m) => m.includes('SW2000')) } : null;
    }
    if (kind === 'LE') {
      const free = freeOf('LE');
      if (opts.le) { const b = free.find((x) => x.le === opts.le); return b ? { v: b } : null; }
      const b = free.sort((a, c) => distKm(a.homePos, inc.pos) - distKm(c.homePos, inc.pos))[0];
      return b ? { v: b } : null;
    }
    if (kind === 'NKTW') {
      const ktw = near(freeOf('KTW'), inc.pos)[0];
      if (ktw) return { v: ktw };
      const rtw = near(freeOf('RTW'), inc.pos)[0];
      return rtw ? { v: rtw } : null;
    }
    const free = freeOf(kind);
    if (!free.length) return null;
    if (['HLF', 'DLK', 'C'].includes(kind)) {
      const isTH = inc.fam === 'TH';
      for (const w of inc.folge) {
        const c = free.filter((v) => v.wache === w);
        if (!c.length) continue;
        const sc = (v) => (v.pref ? (v.pref === (isTH ? 'TH' : 'B') ? 0 : 1) : 0);
        c.sort((a, b) => sc(a) - sc(b));
        return { v: c[0] };
      }
      return null;
    }
    return { v: near(free, inc.pos)[0] };
  }

  // ---------- Zeiten ----------
  function departDelay(v) {
    if (v.block) return R.int(240, 480);
    if (v.org === 'FU') return R.int(45, 110);
    if (v.org === 'RD') return R.int(40, 80);
    return R.int(40, 90);
  }
  function driveSeconds(from, to, kmh) {
    const km = distKm(from, to) * 1.35;
    return Math.max(60, R.jitter((km / kmh) * 3600, 0.12));
  }

  // ---------- Alarmierung ----------
  const unitOf = (inc, vid) => { for (let i = inc.units.length - 1; i >= 0; i--) if (inc.units[i].vid === vid && !inc.units[i].left) return inc.units[i]; return null; };
  function alarm(pick, inc, kind, reqAt) {
    const v = pick.v;
    v.incidentId = inc.id;
    v.status = 'A';
    v.job = { phase: 'alarm', until: S.now + departDelay(v) * 1000, force: pick.force };
    if (pick.attach) {
      const a = pick.attach;
      a.carriedBy = v.id; a.incidentId = inc.id; a.status = 'A'; v.carry = a.id;
    }
    inc.units.push({ vid: v.id, kind, reqAt: reqAt || S.now, at: S.now, left: false, block: !!v.block });
    return v.name + (pick.attach ? ' + ' + pick.attach.name.replace(/^0\d-/, '') : '');
  }

  function dispatch(inc, kinds, reason) {
    const names = [], ext = [];
    for (const k of kinds) {
      const spec = typeof k === 'string' ? { kind: k } : k;
      if (spec.kind.startsWith('EXT:')) { ext.push(spec.kind.slice(4)); continue; }
      const p = pickVehicle(spec.kind, inc, spec);
      if (p) names.push(alarm(p, inc, spec.kind));
      else {
        // Ersatz: TOJ-LF für fehlendes HLF
        if (spec.kind === 'HLF') { const lf = pickVehicle('LF', inc); if (lf) { names.push(alarm(lf, inc, 'HLF') + ' (für HLF)'); continue; } }
        if (spec.kind === 'LE' && spec.le && S.vehicles.find((v) => v.le === spec.le && v.incidentId === inc.id)) continue;
        inc.missing.push(spec.kind);
        log(inc, `${KIND_LABEL[spec.kind] || spec.kind}: kein Fahrzeug verfügbar – nicht besetzt`, 'warn');
      }
    }
    if (names.length) log(inc, `${reason ? reason + ': ' : 'Alarmiert: '}${names.join(', ')}`, 'alarm');
    if (ext.length) log(inc, `Nicht im Übungsbestand (nur Info): ${ext.join(', ')}`, 'info');
  }

  // FF-Regeln nach AAO (Fußnoten ** und ***) – die Regeln selbst stehen in den Stammdaten (FF_REGELN)
  function ffKinds(inc, item) {
    if (inc.fam === 'RD') return [];
    const le = zustaendigeLE(inc.pos).nr;
    const r = FF_REGELN(inc, item, { le, inA: (arr) => arr.includes(le), ffTimeOk, lesByDist, alleLE: LES.map((l) => l.nr) }) || {};
    let nrs = (r.nrs || []).slice();
    const extra = r.extra || [];
    // Partner-LEs werden gemeinsam alarmiert
    for (const n of nrs.slice()) { const l = LES.find((x) => x.nr === n); const p = l && l.partner; if (p && !nrs.includes(p)) nrs.push(p); }
    nrs = [...new Set(nrs)];
    return [...nrs.map((n) => ({ kind: 'LE', le: n })), ...extra];
  }

  // ---------- FF: Block rückt aus ----------
  function ffStrength() {
    const d = new Date(S.now), h = d.getHours(), we = d.getDay() === 0 || d.getDay() === 6;
    const bonus = we || h >= 18 || h < 6 ? 1 : 0;
    const r = Math.random();
    let total = r < 0.12 ? R.int(2, 3) : r < 0.82 ? R.int(4, 8) : r < 0.96 ? R.int(9, 10) : R.int(11, 12);
    total = Math.min(14, total + (r < 0.12 ? 0 : bonus));
    const zf = total >= 10 && R.chance(0.4) ? 1 : 0;
    const gf = total <= 3 ? 1 : total >= 9 ? 2 : 1;
    const ms = total - zf - gf;
    const agt = total <= 3 ? R.int(0, 1) : R.int(Math.floor(total * 0.3), Math.floor(total * 0.6));
    return { zf, gf, ms, total, agt, text: `${zf}/${gf}/${ms}/${total}`, };
  }
  const RANK = ['HLF10', 'LF20KATS', 'LF10', 'DLK23'];
  function ffDepart(block, inc, force) {
    if (!block.se && R.chance(0.03)) {
      log(inc, `${block.name}: keine ausreichende Besatzung – rückt nicht aus`, 'warn');
      block.incidentId = null; block.status = 2; block.job = null;
      const u = inc.units.find((x) => x.vid === block.id && !x.left); if (u) u.left = true;
      inc.missing.push('LE');
      emit('update');
      return;
    }
    const st = ffStrength();
    const avail = block.members.map(byId).filter((m) => !m.incidentId);
    let chosen = [];
    if (block.se) {
      chosen = avail.slice(0, Math.max(1, Math.min(avail.length, st.total >= 6 ? 3 : 2)));
      if (st.total > 8) { st.total = Math.min(st.total, 8); }
    } else {
      const fz = avail.filter((m) => RANK.some((r) => m.id.includes(r))).sort((a, b) => RANK.findIndex((r) => a.id.includes(r)) - RANK.findIndex((r) => b.id.includes(r)));
      const other = avail.filter((m) => !fz.includes(m) && !m.id.includes('SW2000') && !m.id.includes('GW-L2'));
      if (fz[0]) chosen.push(fz[0]);
      if (st.total > 6) { const second = fz[1] && R.chance(0.5) ? fz[1] : other.shift() || fz[1]; if (second) chosen.push(second); }
      if (st.total > 9) { const third = other.shift(); if (third) chosen.push(third); }
      if (!chosen.length && avail[0]) chosen.push(avail[0]);
    }
    if (force) { const f = byId(force); if (f && !f.incidentId && !chosen.includes(f)) chosen.push(f); }
    block.job = null;
    block.status = 3;
    block.strength = st;
    const u = inc.units.find((x) => x.vid === block.id && !x.left);
    if (u) { u.strength = st; u.marschAt = S.now; }
    for (const m of chosen) {
      m.incidentId = inc.id;
      m.status = 3;
      startTrip(m, 'drive', inc.pos, 45);
      inc.units.push({ vid: m.id, kind: 'FFV', parent: block.id, reqAt: u ? u.reqAt : S.now, at: u ? u.at : S.now, marschAt: S.now, left: false });
    }
    log(inc, `${block.name} rückt aus mit ${chosen.map((m) => m.id).join(', ')} – Stärke ${st.text}, ${st.agt} AGT`, 'ff');
    emit('update');
  }

  // ---------- Einsatz anlegen ----------
  function createIncident(o) {
    const cat = CATALOG[o.key];
    const item = o.item || R.pick(cat.items);
    const bf = bereichsfolge(o.pos);
    const inc = {
      id: 'E' + S.nextNr, nr: String(S.nextNr++), key: o.key, stw: cat.stw, fam: famOf(cat.stw), bma: !!cat.bma, rd: !!cat.rd,
      item, schlagwort: item.sw, anlass: item.anlass, title: `${cat.stw}-${item.sw}`,
      addr: o.addr, pos: o.pos.slice(), folge: bf.folge, folgeExact: bf.exact,
      t0: S.now, status: 'laufend', units: [], missing: [], log: [], sections: makeSections('standard'), transports: [], photos: [], requests: [], drawings: [], custom: [],
      lageDone: false, midAt: null, endAt: null,
    };
    if (inc.rd) inc.endAt = null;
    else if (o.duration === 'open') inc.endAt = null;
    else if (typeof o.duration === 'number') inc.endAt = S.now + o.duration * 60000;
    else { const d = DURATION[o.key] || DURATION[cat.stw] || [30, 60]; inc.endAt = S.now + R.skew(d[0], d[1]) * 60000; }

    S.incidents.unshift(inc);
    log(inc, `Einsatz eröffnet: ${inc.title} – ${inc.anlass}`, 'info');
    const kinds = AAO[inc.stw].slice();
    for (const m of item.minus || []) { const i = kinds.indexOf(m); if (i >= 0) kinds.splice(i, 1); }
    kinds.push(...(item.plus || []));
    if (Array.isArray(o.units)) {
      // von der Leitung geprüfter / geänderter Vorschlag
      const names = [];
      for (const u of o.units) {
        const v = byId(u.vid);
        if (!v || !isFree(v)) { inc.missing.push(u.kind); log(inc, `${v ? v.name : (KIND_LABEL[u.kind] || u.kind)}: nicht mehr frei – nicht besetzt`, 'warn'); continue; }
        const a = u.attach ? byId(u.attach) : null;
        names.push(alarm({ v, attach: a && !a.incidentId && !a.carriedBy ? a : null, force: u.force || undefined }, inc, u.kind));
      }
      for (const k of o.missing || []) { inc.missing.push(k); log(inc, `${KIND_LABEL[k] || k}: kein Fahrzeug verfügbar – nicht besetzt`, 'warn'); }
      if (names.length) log(inc, `Alarmiert: ${names.join(', ')}`, 'alarm');
      if ((o.ext || []).length) log(inc, `Nicht im Übungsbestand (nur Info): ${o.ext.join(', ')}`, 'info');
    } else if (!item.nodispatch) {
      dispatch(inc, kinds, null);
      const ff = ffKinds(inc, item);
      if (ff.length) dispatch(inc, ff, 'FF nach AAO');
    }
    for (const c of o.frei || []) addCustom(inc, c);
    emit('incident', inc);
    return inc;
  }

  function nachalarm(inc, kind, vid, le, reqAt) {
    let p = null;
    if (vid) { const v = byId(vid); if (v && isFree(v)) p = { v }; else if (v) { kind = v.kind === 'LE' ? 'LE' : v.kind; le = v.le; } }
    if (!p && kind) p = pickVehicle(kind, inc, { le });
    if (p) {
      const k = p.v.kind === 'LE' ? 'LE' : vid ? p.v.kind : kind;
      log(inc, `Nachalarmiert: ${alarm(p, inc, k, reqAt)}`, 'alarm');
      // Partner-LE gemeinsam
      if (p.v.kind === 'LE') { const pt = LES.find((l) => l.nr === p.v.le).partner; if (pt) { const q = pickVehicle('LE', inc, { le: pt }); if (q) log(inc, `Nachalarmiert: ${alarm(q, inc, 'LE', reqAt)}`, 'alarm'); } }
      emit('update');
      return true;
    }
    log(inc, `Nachalarmierung ${KIND_LABEL[kind] || kind}: kein Fahrzeug frei`, 'warn');
    emit('update');
    return false;
  }

  // Nachforderung: erst „angefordert“, die Leitstelle alarmiert nach 20–60 s
  function reqLabel(kind, vid, le) {
    if (vid) { const v = byId(vid); return v ? v.name : vid; }
    if (kind === 'LE') return 'LE ' + le;
    return KIND_LABEL[kind] || kind;
  }
  function request(inc, kind, vid, le) {
    if (!inc || inc.status !== 'laufend') return false;
    inc.requests = inc.requests || [];
    const label = reqLabel(kind, vid, le);
    inc.requests.push({ id: 'Q' + Math.random().toString(36).slice(2, 8), kind, vid: vid || null, le: le || null, label, at: S.now, due: S.now + R.int(20, 60) * 1000 });
    log(inc, `Nachgefordert: ${label}`, 'req');
    emit('update');
    return true;
  }
  function processRequests(inc) {
    if (!inc.requests || !inc.requests.length) return;
    const due = inc.requests.filter((q) => S.now >= q.due);
    if (!due.length) return;
    inc.requests = inc.requests.filter((q) => S.now < q.due);
    for (const q of due) nachalarm(inc, q.kind, q.vid, q.le, q.at);
  }

  // ---------- Freie Einheiten (frei benennbar, z. B. THW, Polizei, Nachbarwehr) ----------
  const CUSTOM_ORGS = ['BF', 'FF', 'RD', 'FU', 'THW', 'POL', 'EXT'];
  const STAGE_TXT = ['angefordert', 'alarmiert', 'auf Marsch', 'vor Ort'];
  function addCustom(inc, o) {
    if (!inc || inc.status !== 'laufend') return null;
    inc.custom = inc.custom || [];
    if (inc.custom.length >= 60) return null;
    const st = Math.max(0, Math.min(3, Math.floor(+o.stage || 0)));
    const c = { id: 'C' + Math.random().toString(36).slice(2, 8), name: String(o.name || 'Einheit').trim().slice(0, 60) || 'Einheit', org: CUSTOM_ORGS.includes(o.org) ? o.org : 'EXT', info: String(o.info || '').slice(0, 300), stage: st, times: [null, null, null, null], plan: null, leftAt: null };
    for (let i = 0; i <= st; i++) c.times[i] = S.now;
    if (o.auto && st < 3) {
      const p = [null, null, null, null];
      let t = S.now;
      if (st < 1) { t += R.int(30, 60) * 1000; p[1] = t; }
      if (st < 2) { t += R.int(60, 180) * 1000; p[2] = t; }
      const eta = +o.eta > 0 ? +o.eta : 15;
      p[3] = Math.max(t + 60000, S.now + eta * 60000);
      c.plan = p;
    }
    inc.custom.push(c);
    log(inc, `Einheit ${STAGE_TXT[st]}: ${c.name}`, 'req');
    emit('update');
    return c;
  }
  function setCustom(inc, id, patch) {
    const c = inc && (inc.custom || []).find((x) => x.id === id);
    if (!c) return false;
    const key = 'X:' + c.id;
    if (patch.del) { inc.custom = inc.custom.filter((x) => x !== c); removeFromSections(inc, key); emit('update'); return true; }
    if ('name' in patch) c.name = String(patch.name || '').trim().slice(0, 60) || c.name;
    if ('org' in patch && CUSTOM_ORGS.includes(patch.org)) c.org = patch.org;
    if ('info' in patch) c.info = String(patch.info || '').slice(0, 300);
    if ('stage' in patch) {
      const s = Math.floor(+patch.stage);
      c.plan = null;
      if (s === 4) { c.stage = 4; c.leftAt = S.now; markLeft(inc, key); }
      else if (s >= 0 && s <= 3) {
        c.stage = s; c.leftAt = null;
        for (let i = 0; i <= s; i++) if (!c.times[i]) c.times[i] = S.now;
        for (let i = s + 1; i < 4; i++) c.times[i] = null;
        inc.sections.left = inc.sections.left.filter((x) => x !== key);
      }
    }
    emit('update');
    return true;
  }
  function tickCustom(inc) {
    for (const c of inc.custom || []) {
      if (!c.plan || c.stage >= 3) continue;
      for (let k = c.stage + 1; k <= 3; k++) if (c.plan[k] && S.now >= c.plan[k]) { c.stage = k; c.times[k] = c.plan[k]; }
      if (c.stage >= 3) c.plan = null;
    }
  }

  function erhoehen(inc, newStw) {
    const have = {};
    for (const u of inc.units) if (!u.parent) have[u.kind] = (have[u.kind] || 0) + 1;
    const need = {};
    for (const k of AAO[newStw]) need[k] = (need[k] || 0) + 1;
    const diff = [];

  }

  // ---------- Freimelden ----------
  function markLeft(inc, vid) {
    const u = inc.units.find((x) => x.vid === vid && !x.left);
    if (u) u.left = true;

  }
  function release(v) {

    for (const u of inc.units) {
      if (u.left) continue;
      const v = byId(u.vid);
      if (v && v.incidentId === inc.id) release(v);
    }

    inc.endedAt = S.now;
    inc.requests = [];

      left: [],

  // Status von Hand setzen (Übungsleitung), z. B. wenn etwas nicht schnell genug geht
  function setStatus(v, st) {

    const j = v.job;

      x.job = null; x.pos = homeOf(x).slice(); x.transportInc = null; x.status = 2;
      if (x.carry) { const a = byId(x.carry); a.carriedBy = null; a.incidentId = null; a.status = 2; a.pos = homeOf(a).slice(); x.carry = null; }

      emit('update');

    }
    v.oos = false;
    switch (st) {
      case '3':
        if (!v.incidentId || !inc) return fail('Status 3 geht nur für Fahrzeuge in einem Einsatz.');

    setStatus, byId, incById, homeOf, isFree, onDuty, createIncident, nachalarm, request, addCustom, setCustom, erhoehen, release, endIncident, tick,

/* ---------- Geocodierung (Photon / OpenStreetMap) ---------- */
const GEO = { cache: store.get('fa-geo-v1', {}), q: [], busy: false, ok: null };
const BBOX = { s: 51.39, n: 51.545, w: 7.08, e: 7.38 };
function inBochum(p) { return p && p[0] > BBOX.s && p[0] < BBOX.n && p[1] > BBOX.w && p[1] < BBOX.e; }
async function photon(q, timeoutMs) {
  const ctl = new AbortController();
  const tm = setTimeout(() => ctl.abort(), timeoutMs || 4000);
  try {
    const r = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=1&lang=de&lat=51.48&lon=7.22`, { signal: ctl.signal });
    const j = await r.json();
    GEO.ok = true;
    const f = j.features && j.features[0];
    if (!f) return null;
    return { pos: [f.geometry.coordinates[1], f.geometry.coordinates[0]], props: f.properties };
  } catch (e) { GEO.ok = false; return null; } finally { clearTimeout(tm); }
}
async function geocodeAddress(street, plz, timeoutMs) {
  const q = `${street}, ${plz || ''} Bochum`.replace(/\s+/g, ' ');
  if (GEO.cache[q]) return GEO.cache[q];
  const r = await photon(q, timeoutMs);
  if (!r || !inBochum(r.pos)) return null;
  const want = street.toLowerCase().split(/[\s,]/)[0].slice(0, 6);
  const got = String(r.props.street || r.props.name || '').toLowerCase();
  if (want && !got.includes(want)) return null;
  GEO.cache[q] = r.pos; store.set('fa-geo-v1', GEO.cache);
  return r.pos;
}
async function reverseGeocode(pos) {
  try {
    const r = await fetch(`https://photon.komoot.io/reverse?lat=${pos[0]}&lon=${pos[1]}&lang=de`);
    const j = await r.json();
    const p = j.features && j.features[0] && j.features[0].properties;
    if (!p) return null;
    return { street: [p.street || p.name, p.housenumber].filter(Boolean).join(' '), plz: p.postcode || '', district: p.district || p.locality || '' };
  } catch (e) { return null; }
}
// Hintergrund: Wachen, Gerätehäuser, Kliniken genau verorten (1 Anfrage/Sekunde)
function refineStations() {
  const jobs = [];
  for (const k in SITES) jobs.push(SITES[k]);
  for (const le of LES) jobs.push(le);
  for (const h of HOSPITALS) jobs.push(h);
  (async () => {
    for (const o of jobs) {
      const m = o.addr.match(/^(.*),\s*(\d{5})/);
      if (!m) continue;
      const cached = GEO.cache[`${m[1]}, ${m[2]} Bochum`];
      const p = cached || await geocodeAddress(m[1], m[2], 5000);
      if (p) {
        o.pos[0] = p[0]; o.pos[1] = p[1]; // Array bleibt dasselbe → Fahrzeuge folgen
        for (const v of sim.vehicles) if (!v.job && (v.status === 2 || v.status === 6)) { const h = sim.homeOf(v); v.pos = h.slice(); }
      }
      if (!cached) await new Promise((r) => setTimeout(r, 1100));
      if (GEO.ok === false) break;
    }
    drawSites();
  })();
}

function withFallback(map, primary, chain, note) {
  let cur = primary, idx = 0;
  const watch = (layer) => {
    let loaded = 0, errs = 0, done = false;
    layer.on('tileload', () => { loaded++; if (loaded === 1 && layer !== primary) note(layer.__label || ''); });
    layer.on('tileerror', () => {
      errs++;

      done = true;
      const next = chain && chain[idx++];
      if (next) {
        map.removeLayer(layer);
        const i = map.__layers.indexOf(layer); if (i >= 0) map.__layers.splice(i, 1);
        cur = next(); cur.addTo(map); cur.bringToBack(); map.__layers.push(cur);
        note('Lade Ersatzkarte …');
        watch(cur);
      } else note(chain ? NO_MAP : 'Dienst nicht erreichbar');
    });
  };
  watch(primary);
  return primary;
}

function pickAddress(types) {
  const busy = new Set(sim.incidents.filter((i) => i.status === 'laufend').map((i) => i.addr.street));
  let pool = [];
  if (types.includes('BAB') && Math.random() < 0.4) pool = BAB_ADDR;
  if (!pool.length) pool = ALL_ADDR.filter((a) => types.includes(a.type));
  if (!pool.length) pool = ALL_ADDR.filter((a) => a.type === 'W');
  const free = pool.filter((a) => !busy.has(a.street));
  const a = R.pick(free.length ? free : pool);
  return Object.assign({}, a, { pos: a.pos.slice() });
}

async function newIncident(o) {
  const cat = CATALOG[o.key];
  const item = o.item || R.pick(cat.items);
  let addr = o.addr || pickAddress(item.types);
  let pos = o.pos || addr.pos;
  if (!o.pos && !addr.noGeo) {
    const g = await geocodeAddress(addr.street, addr.plz, 2500);
    if (g) pos = g;
  }
  let man = {};
  if (o.review && CAN_LEAD) {
    const r = await reviewAlarm({ key: o.key, item, addr, pos });
    if (!r) { toast('Alarmierung abgebrochen'); return null; }
    man = r;

  const inc = await api.create(Object.assign({ key: o.key, item, addr, pos, duration: o.duration }, man));
  if (!inc) return null;
  if (o.select || !UI.sel) selectInc(inc.id);
  render(true);

}

function zsHTML(stage, times) {

function sectionMap(inc) {

}

function resizeImage(file, max) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Bild konnte nicht gelesen werden')); };
    img.src = url;
  });
}
async function previewPhoto(file) {
  UI.fotoData = null;
  const prev = $('#fotoPrev');
  if (!file) { prev.hidden = true; return; }
  try { UI.fotoData = await resizeImage(file, 1600); prev.src = UI.fotoData; prev.hidden = false; }

}

function freeCount(k) {
  const V = sim.vehicles;
  if (k.startsWith('WLF:')) return V.some((v) => v.kind === 'WLF' && sim.isFree(v)) ? V.filter((v) => v.kind === 'AB' && v.abType === k.slice(4) && !v.incidentId).length : 0;
  if (k === 'SW2000') return V.filter((v) => v.kind === 'LE' && sim.isFree(v) && v.members.some((m) => m.includes('SW2000'))).length;
  if (k === 'GWW') return V.filter((v) => v.kind === 'GWW' && sim.isFree(v)).length;
  return V.filter((v) => v.kind === k && sim.isFree(v)).length;
}

/* Ziehen & Ablegen (Touch und Maus) */
function dropTargetAt(x, y) {
  const el = document.elementFromPoint(x, y);
  return el && el.closest('[data-drop]');
}
document.addEventListener('pointerdown', (e) => {
  const card = e.target.closest('#ab .vcard');
  if (!card) return;

});
window.addEventListener('pointermove', (e) => {
  const d = UI.drag;
  if (!d || e.pointerId !== d.id) return;
  if (!d.on && Math.hypot(e.clientX - d.x, e.clientY - d.y) > 8) {
    d.on = true;
    d.ghost = d.el.cloneNode(true);
    d.ghost.classList.add('ghost');
    d.ghost.style.width = d.el.offsetWidth + 'px';
    document.body.appendChild(d.ghost);
    d.el.classList.add('dragging');
  }
  if (!d.on) return;
  e.preventDefault();
  d.ghost.style.left = e.clientX - 40 + 'px';
  d.ghost.style.top = e.clientY - 30 + 'px';
  const t = dropTargetAt(e.clientX, e.clientY);
  if (d.hot !== t) { if (d.hot) d.hot.classList.remove('hot'); if (t) t.classList.add('hot'); d.hot = t; }
  const bd = $('#abBoard'), b = bd.getBoundingClientRect();
  if (e.clientY > b.bottom - 50 && e.clientY < b.bottom) bd.scrollTop += 14;
  if (e.clientY < b.top + 50) bd.scrollTop -= 14;
  if (e.clientX > b.right - 50) bd.scrollLeft += 14;
  if (e.clientX < b.left + 50) bd.scrollLeft -= 14;
}, { passive: false });
window.addEventListener('pointerup', (e) => {
  const d = UI.drag;
  if (!d || e.pointerId !== d.id) return;
  UI.drag = null;
  if (d.on) {
    d.ghost.remove();
    d.el.classList.remove('dragging');
    if (d.hot) d.hot.classList.remove('hot');
    const t = dropTargetAt(e.clientX, e.clientY);
    const inc = sim.incById(UI.sel);
    if (t && inc) moveVehicle(inc, d.vid, t.dataset.drop);
    UI.tapSel = null;
    UI.suppressUntil = Date.now() + 400;
    renderAB();
  }
});

/* ---------- Lagekarte zeichnen ----------
   Taktische Zeichen nach „Taktische Zeichen im Bevölkerungsschutz“ (BBK, Empfehlung FwDV/DV 102, 2024).
   Grundzeichen: Formation (Rechteck), Person (Raute), Landfahrzeug, Stelle (Kreis), Gebäude,
   Gefahr (rotes Dreieck), markanter Punkt, Ereignis. Farben: Feuerwehr rot, Führung gelb,
   Hilfsorganisationen weiß, THW blau, Polizei grün, Bundeswehr braun, zivil grau.
   Je Objekt: Typ, Zeichentext (wo vorgesehen), Titel (auf der Karte), Info (beim Antippen). */
const TZC = { fw: '#e8312a', fue: '#ffe400', thw: '#1f3c96', pol: '#3db54a', bw: '#a0662f', hio: '#ffffff', ziv: '#c4c4c4', gef: '#e30613', blau: '#1a5fb4' };

const tzText = (x, y, t, base, col, maxW, halo) => {

  const h = halo ? ` paint-order="stroke" stroke="${halo}" stroke-width="3" stroke-linejoin="round"` : '';
  return `<text x="${x}" y="${y}" font-size="${fs.toFixed(1)}" font-weight="700" font-family="${TZ_FONT}" text-anchor="middle" dominant-baseline="central" fill="${col || '#000'}"${fit}${h}>${esc(t)}</text>`;

const tzSvg = (w, h, vb, body) => `<svg width="${w}" height="${h}" viewBox="${vb}" class="tz-icon">${body}</svg>`;

const tzArrowLR = (x1, x2, y) => `<path d="M${x1 + 3},${y} H${x2 - 3}" stroke="#000" stroke-width="1.6"/><path d="M${x1},${y} l4,-3 v6z M${x2},${y} l-4,-3 v6z" fill="#000"/>`;
const tzDots = (n, cx, y) => Array.from({ length: n }, (_, i) => `<circle cx="${cx + (i - (n - 1) / 2) * 6}" cy="${y}" r="1.9" fill="#000"/>`).join('');

  if (o.san) b += `<path d="M24,${y0 + 1} V${y0 + H - 1} M3,${y0 + 15} H45" stroke="#000" stroke-width="1.6"/>`;

const TZ = Object.fromEntries(TZ_LIST.map((d) => [d.n, d]));

function pointIconHtml(typ, txt) {
  const def = TZ[typ];
  if (def && def.svg) return def.svg(txt != null ? txt : def.t || '');
  return '<svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="7" fill="#888" stroke="#fff" stroke-width="1.5"/></svg>';
}
const iconDims = (html) => { const w = +(html.match(/width="(\d+)"/) || [0, 18])[1], h = +(html.match(/height="(\d+)"/) || [0, 18])[1]; return [w, h]; };
const scaleIcon = (html, px) => { const [w, h] = iconDims(html); const k = Math.min(1, px / Math.max(w, h)); return html.replace(/width="\d+"/, `width="${Math.round(w * k)}"`).replace(/height="\d+"/, `height="${Math.round(h * k)}"`); };
function lineStyle(typ) { const d = TZ[typ]; return Object.assign({}, d && d.g === 'l' ? d.style : { color: '#222', weight: 3, dashArray: '8,6' }); }
function polyStyle(typ) { const d = TZ[typ]; return Object.assign({}, d && d.g === 'f' ? d.style : { color: '#555', fillColor: '#999', fillOpacity: 0.4, weight: 2 }); }

const LK = { map: null, tool: null, pts: [], tmp: null, vtx: [], sel: null, saveT: null, pending: null, q: '', open: new Set(['Führung']) };
const lkInc = () => (LK.ctx === LAGE_ID ? LAGE : sim.incById(UI.sel));
function arrowHead(map, a, b, color) {
  const pa = map.project([a[1], a[0]], 15), pb = map.project([b[1], b[0]], 15);
  const deg = Math.atan2(pb.y - pa.y, pb.x - pa.x) * 180 / Math.PI;
  return L.marker([b[1], b[0]], { interactive: false, icon: L.divIcon({ className: '', iconSize: [0, 0], html: `<svg width="20" height="20" viewBox="-10 -10 20 20" style="position:absolute;left:-10px;top:-10px;transform:rotate(${deg}deg)"><path d="M-6 -7 L9 0 L-6 7 Z" fill="${color}"/></svg>` }) });
}
// Zustand von Zu- und Abwegen (DV 102, 5.8.9): Querstriche bzw. Kreuz in der Mitte der Linie
function midMark(map, c, kind) {
  const P = c.map((p) => map.project([p[1], p[0]], 15));
  let tot = 0; const seg = [];
  for (let i = 1; i < P.length; i++) { const l = P[i].distanceTo(P[i - 1]); seg.push(l); tot += l; }
  let half = tot / 2, i = 0;
  while (i < seg.length - 1 && half > seg[i]) { half -= seg[i]; i++; }
  const a = P[i], b = P[i + 1] || P[i], k = seg[i] ? half / seg[i] : 0;
  const m = map.unproject(L.point(a.x + (b.x - a.x) * k, a.y + (b.y - a.y) * k), 15);
  const deg = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
  const strokes = kind === 'x' ? 'M-7,-9 L7,9 M7,-9 L-7,9' : Array.from({ length: kind }, (_, j) => `M${(j - (kind - 1) / 2) * 5.5},-10 V10`).join(' ');
  return L.marker(m, { interactive: false, icon: L.divIcon({ className: '', iconSize: [0, 0], html: `<svg width="30" height="30" viewBox="-15 -15 30 30" style="position:absolute;left:-15px;top:-15px;transform:rotate(${deg}deg)"><path d="${strokes}" stroke="#fff" stroke-width="6" stroke-linecap="round"/><path d="${strokes}" stroke="#111" stroke-width="2.6" stroke-linecap="round"/></svg>` }) });
}
// Zeichnungen eines Einsatzes auf eine Karte bringen (editierbar nur in der Lagekarte)
function drawLayers(map, inc, editable, glob) {
  if (!map) return;
  const K = glob ? '__gl' : '__dl', S = glob ? '__gsig' : '__dsig';
  const list = inc ? inc.drawings || [] : [];
  const sig = JSON.stringify(list) + '|' + (editable ? LK.sel : '');
  if (map[S] === sig) return;
  map[S] = sig;
  if (!map[K]) map[K] = L.layerGroup().addTo(map);
  const grp = map[K];
  grp.clearLayers();
  for (const d of list) {
    const sel = editable && LK.sel === d.id;
    const def = TZ[d.typ] || {};
    let lyr;
    if (d.g === 'p') {
      const ic = pointIconHtml(d.typ, tzTxt(d)), [w, h] = iconDims(ic);
      const lbl = d.titel ? `<span class="tz-lbl" style="position:absolute;left:${w / 2}px;top:${h + 1}px">${esc(d.titel)}</span>` : '';
      lyr = L.marker([d.c[1], d.c[0]], { draggable: editable, zIndexOffset: 800, icon: L.divIcon({ className: '', iconSize: [w, h], iconAnchor: [w / 2, h / 2], html: `<div class="${sel ? 'tz-sel' : ''}" style="position:relative;width:${w}px;height:${h}px">${ic}${lbl}</div>` }) });
      if (editable) lyr.on('dragend', (e) => { const ll = e.target.getLatLng(); const i = lkInc(); const cur = i && i.drawings.find((x) => x.id === d.id); if (cur) { cur.c = [+ll.lng.toFixed(7), +ll.lat.toFixed(7)]; lkSave(); } });
    } else {
      const ll = d.c.map((p) => [p[1], p[0]]);
      const st = d.g === 'l' ? lineStyle(d.typ) : polyStyle(d.typ);
      if (sel) st.weight = (st.weight || 2) + 2;
      if (d.g === 'l' && def.under) grp.addLayer(L.polyline(ll, Object.assign({ interactive: false }, def.under)));
      lyr = d.g === 'l' ? L.polyline(ll, st) : L.polygon(ll, st);
      if (sel) lyr.on('add', () => { const el = lyr.getElement && lyr.getElement(); if (el) el.classList.add('tz-sel'); });
      if (d.g === 'l' && def.arrow && d.c.length >= 2) grp.addLayer(arrowHead(map, d.c[d.c.length - 2], d.c[d.c.length - 1], st.color));
      if (d.g === 'l' && def.mid && d.c.length >= 2) grp.addLayer(midMark(map, d.c, def.mid));
      if (d.titel) lyr.bindTooltip(esc(d.titel), d.g === 'l' ? { permanent: true, direction: 'top', offset: [0, -10], className: 'tz-tt' } : { permanent: true, direction: 'center', className: 'tz-tt' });
    }
    if (editable) lyr.on('click', (e) => { if (LK.tool) return; L.DomEvent.stopPropagation(e); LK.sel = d.id; renderLk(true); });
    else if (d.g === 'p') lyr.bindTooltip(esc([d.typ, d.titel].filter(Boolean).join(': ')) + (d.info ? '<br>' + esc(d.info) : ''), { direction: 'top' });
    else if (!d.titel || d.info) lyr.bindPopup(`<b>${esc(d.typ)}${d.titel ? ': ' + esc(d.titel) : ''}</b>${d.info ? '<br>' + esc(d.info) : ''}`);
    grp.addLayer(lyr);
  }
}

  const pend = LK.pending = { id: inc.id, d: inc.drawings };
  LK.saveT = setTimeout(async () => {
    if (pend.id === LAGE_ID) { sim.lage.drawings = pend.d; await api.lage(pend.d); }
    else { const i = sim.incById(pend.id); if (i) { i.drawings = pend.d; await api.drawings(i); } }

  for (const s of EL.list) for (const r of s.reiter) for (const e of r.einlagen) for (const b of e.bilder.concat(e.dateien || [])) if (b.path && !String(b.data || '').startsWith('data:')) imgs.push(b);
  if (!imgs.length) { EL.signedAt = Date.now(); return; }
  const m = await FILES.signMany([...new Set(imgs.map((b) => b.path))], 0.5);
  for (const b of imgs) if (m[b.path]) b.data = m[b.path];
  EL.signedAt = Date.now();
}

const PACKS = [{ file: 'uebung/stabsuebung-2026-11-24.bin', name: 'Stabsübung 24.11.2026 – Feuerwehr' }];
async function packDecrypt(buf, pw) {
  const u = new Uint8Array(buf);
  if (String.fromCharCode(...u.slice(0, 4)) !== 'EUE1') throw new Error('Datei ungültig');
  const salt = u.slice(4, 20), iv = u.slice(20, 32), ct = u.slice(32);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 600000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  let plain;
  try { plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct); } catch (e) { throw new Error('Kennwort falsch'); }
  const txt = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(txt);
}

const EL_EXT = { pdf: 'pdf', 'application/pdf': 'pdf', xlsx: 'xlsx', docx: 'docx', png: 'png', jpg: 'jpg', jpeg: 'jpg' };

function elLocalPos(q, plz) {
  const norm = (x) => String(x || '').toLowerCase().replace(/ß/g, 'ss').replace(/str(\.|asse)\b/g, 'str').replace(/[^a-zäöü0-9]/g, '');
  const m = String(q).split(/[\/,]/)[0].trim().match(/^(.*?)(?:\s+(\d+)\s*[a-z]?)?$/i);
  const want = norm(m ? m[1] : q), nr = m && m[2] ? +m[2] : 0;
  let best = null;
  const cand = [];
  for (const x of (typeof ALL_ADDR !== 'undefined' ? ALL_ADDR : [])) cand.push([x.street, x.pos]);
  for (const h of (typeof HOSPITALS !== 'undefined' ? HOSPITALS : [])) cand.push([String(h.addr).split(',')[0], h.pos]);
  for (const h of [...(typeof LES !== 'undefined' ? LES : []), ...Object.values(typeof SITES !== 'undefined' ? SITES : {})]) if (h && h.addr) cand.push([String(h.addr).split(',')[0], h.pos]);
  for (const [street, pos] of cand) {
    const sm = String(street || '').match(/^(.*?)(?:\s+(\d+)\s*[a-z]?)?$/i);
    if (!sm || norm(sm[1]) !== want || !Array.isArray(pos)) continue;
    const d = Math.abs((sm[2] ? +sm[2] : 0) - nr);
    if (!best || d < best.d) best = { d, pos };
  }
  return best ? best.pos.slice() : null;
}

// RD-Last: geplante RD-Einsätze (nur die Zentrale arbeitet sie ab)
function planRd(anzahl, minuten) {
  sim.planQ = sim.planQ || [];
  const span = Math.max(0, minuten) * 60000;
  for (let i = 0; i < anzahl; i++) {
    const at = sim.now + (anzahl > 1 ? (span * i) / (anzahl - 1) : 0) + (i ? Math.round((Math.random() - 0.5) * 60000) : 0);
    sim.planQ.push({ at: Math.max(sim.now, at), key: R.pick(['R10', 'R10', 'R10', 'R11', 'R11']) });
  }
  sim.planQ.sort((a, b) => a.at - b.at);
}
let planBusy = false;
async function processPlan() {
  const q = sim.planQ || [];
  if (planBusy || !q.length || q[0].at > sim.now) return;
  planBusy = true;
  try {
    while ((sim.planQ || []).length && sim.planQ[0].at <= sim.now) {
      const d = sim.planQ.shift();
      if (CATALOG[d.key]) await Promise.race([newIncident({ key: d.key }).catch((e) => console.error(e)), new Promise((r) => setTimeout(r, 10000))]);
    }
  } finally { planBusy = false; }
}

/* ---------- Alarmierung prüfen: Fahrzeugvorschlag ansehen, ändern, Freitext ergänzen ---------- */
function previewAlarm(o) {
  // Probelauf in einer Kopie der Simulation – am echten Stand ändert sich nichts
  const t = createSim();
  t.setRouter(null);
  t.now = sim.now; t.nextNr = sim.nextNr;
  t.vehicles = JSON.parse(JSON.stringify(sim.vehicles));
  t.incidents = JSON.parse(JSON.stringify(sim.incidents));
  t.reindex();
  const inc = t.createIncident({ key: o.key, item: o.item, addr: o.addr, pos: o.pos, duration: 'open' });
  const units = inc.units.map((u) => { const v = t.byId(u.vid); return { vid: u.vid, kind: u.kind, attach: v && v.carry || null, force: v && v.job && v.job.force || null }; });
  const extLog = inc.log.find((l) => /^Nicht im Übungsbestand/.test(l.text));
  const ext = extLog ? extLog.text.replace(/^[^:]*:\s*/, '').split(/,\s*/).filter(Boolean) : [];
  return { title: inc.title, units, missing: inc.missing.slice(), ext };
}

function avCount(kind) {

  else if (f && t.id === 'elEZeit') f.e.zeit = elNormZeit(t.value);
  else if (f && f.e.aktion && ['elASw', 'elAAnl', 'elAStr', 'elAPlz', 'elAObj'].includes(t.id)) f.e.aktion[{ elASw: 'sw', elAAnl: 'anlass', elAStr: 'strasse', elAPlz: 'plz', elAObj: 'objekt' }[t.id]] = t.value;
  else if (f && f.e.aktion && t.id === 'elAPlus') f.e.aktion.plus = t.value.split(/[,;]+/).map((x) => x.trim()).filter(Boolean);
  else if (f && f.e.aktion && t.id === 'elAKinds') f.e.aktion.kinds = t.value.split(/[,;]+/).map((x) => x.trim()).filter(Boolean).map((x) => Object.keys(KIND_LABEL).find((k) => k.toLowerCase() === x.toLowerCase()) || x);
  else if (f && f.e.aktion && t.id === 'elAAnz') f.e.aktion.anzahl = Math.max(1, Math.min(60, Math.round(+t.value) || 1));
  else if (f && f.e.aktion && t.id === 'elAMin') f.e.aktion.minuten = Math.max(0, Math.min(240, Math.round(+t.value) || 0));
  else if (f && t.classList.contains('el-bc')) { const bb = f.e.bilder.find((x) => x.id === t.dataset.bid); if (bb) bb.cap = t.value; }
  else return;
  elSave();
});
