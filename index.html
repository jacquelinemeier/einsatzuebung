/* ---------- Klicks ---------- */
document.addEventListener('click', async (e) => {
  if (UI.suppressUntil && Date.now() < UI.suppressUntil) return;
  // Karte antippen = auswählen, danach Zielbereich antippen
  const tapCard = e.target.closest('#ab .vcard');
  if (tapCard) {
    const vid = tapCard.dataset.vid;
    UI.tapSel = UI.tapSel === vid ? null : vid;
    for (const c of document.querySelectorAll('#ab .vcard')) c.classList.toggle('sel', c.dataset.vid === UI.tapSel);
    return;
  }
  const menu = $('#menu');
  if (!menu.hidden && !e.target.closest('#menu') && !e.target.closest('[data-act="ab-menu"]') && !e.target.closest('[data-act="layer-more"]')) menu.hidden = true;
  if (e.target === $('#ov')) { closeSheet(); return; }
  // Tippen-und-Ablegen im Abschnittsboard
  if (UI.tapSel && !e.target.closest('[data-act]')) {
    const t = e.target.closest('[data-drop]');
    const inc = sim.incById(UI.sel);
    if (t && inc) { moveVehicle(inc, UI.tapSel, t.dataset.drop); UI.tapSel = null; renderAB(); return; }
  }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  const inc = sim.incById(UI.sel);
  switch (act) {
    case 'toggle-list': if (window.innerWidth <= 900) $('#app').classList.toggle('showlist'); else $('#app').classList.toggle('nolist'); setTimeout(() => { dMap && dMap.invalidateSize(); lMap && lMap.invalidateSize(); }, 60); break;
    case 'view': setView(b.dataset.v); break;
    case 'sel-inc': selectInc(b.dataset.id); if (UI.view !== 'details') setView('details'); break;
    case 'new-inc': openNew(); break;
    case 'open-ul': UI.confirmReset = false; openUL(); break;
    case 'claim': if (await tryClaim(true)) refreshUL(); break;
    case 'ar-del': case 'ar-add': case 'ar-fadd': case 'ar-fdel': case 'ar-cancel': case 'ar-go': await arClick(act, b); break;
    case 'pause-toggle': await api.pause(!sim.paused); if (REMOTE) { sim.paused = !sim.paused; } render(true); toast(sim.paused ? 'Übung pausiert' : 'Übung läuft weiter'); break;
    case 'pack-load': await loadPack(+b.dataset.i || 0); break;
    case 'qr-make': await qrMake(); break;
    case 'qr-print': qrPrint(); break;
    case 'qr-hide': UI.qr = null; refreshUL(); break;
    case 'qr-copy': try { await navigator.clipboard.writeText(UI.qr.url); toast('Link kopiert'); } catch (err) { toast('Kopieren nicht möglich'); } break;
    case 'clock-now': await api.clock(); toast('Übungsuhr steht auf ' + new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })); render(true); refreshUL(); break;
    case 'logout':
      if (NET.host) { await beat(); try { await APPX.sb.rpc('release_host', { p_sid: APPX.sid }); } catch (err) { /* egal */ } NET.host = false; }
      await APPX.sb.auth.signOut(); location.reload(); break;
    case 'stamm-dl': downloadBlob('stammdaten.js', new Blob([APPX.stammCode || ''], { type: 'text/javascript' })); break;
    case 'close-sheet': closeSheet(); break;
    case 'layer': {
      const map = mapByKey(b.dataset.map);
      if (!map) break;
      map.__setLayer(b.dataset.l);
      store.set('fa-layer-' + b.dataset.map, b.dataset.l);
      syncLayerButtons(b.dataset.map);
      $('#menu').hidden = true;
      break;
    }
    case 'layer-more': if (!$('#menu').hidden && $('#menu').__mapMenu) $('#menu').hidden = true; else showMapMenu(b); break;
    case 'lage': openLog(); break;
    case 'dtab-over': closeSheet(); $('#ab').hidden = true; break;
    case 'cu-new': openCuNew(); break;
    case 'cu-edit': openCuEdit(b.dataset.id, b.dataset.inc); break;
    case 'cu-stage-pick': UI.cuStage = +b.dataset.i; for (const x of document.querySelectorAll('#cuStageSeg button')) x.classList.toggle('on', x === b); $('#cuAuto').closest('.switch').hidden = UI.cuStage === 3; $('#cuEtaF').hidden = UI.cuStage === 3 || !$('#cuAuto').checked; break;
    case 'cu-add': {
      const ci = sim.incById($('#cuInc').value);
      const name = $('#cuName').value.trim();
      if (!ci || !name) { toast('Bitte Einsatz und Bezeichnung angeben.'); break; }
      const ok = await api.customAdd(ci, { name, org: $('#cuOrg').value, stage: UI.cuStage || 0, auto: $('#cuAuto').checked && UI.cuStage !== 3, eta: +$('#cuEta').value, info: $('#cuInfo').value.trim() });
      if (ok) toast(`${name} ${['angefordert', 'alarmiert', 'auf Marsch', 'vor Ort'][UI.cuStage || 0]}`);
      closeSheet(); render(true); break;
    }
    case 'cu-stage': { const ci = sim.incById(b.dataset.inc); if (ci) { await api.customSet(ci, b.dataset.id, { stage: +b.dataset.i }); closeSheet(); render(true); } break; }
    case 'cu-save': { const ci = sim.incById(b.dataset.inc); if (ci) { await api.customSet(ci, b.dataset.id, { name: $('#cuName').value, org: $('#cuOrg').value, info: $('#cuInfo').value }); closeSheet(); render(true); } break; }
    case 'cu-del': { const ci = sim.incById(b.dataset.inc); if (ci) { await api.customSet(ci, b.dataset.id, { del: true }); closeSheet(); render(true); } break; }
    case 'zs-f': UI.zsF = UI.zsF === +b.dataset.i ? null : +b.dataset.i; render(true); break;
    case 'fl-tab': UI.fleetTab = b.dataset.t; render(true); break;
    case 'lk-open': openLk(); break;
    case 'lk-lage': openLk(LAGE_ID); break;
    case 'lk-close': closeLk(); break;
    case 'lk-tool': {
      const same = LK.tool === b.dataset.n;
      lkCancel(); LK.sel = null;
      if (!same) LK.tool = b.dataset.n;
      renderLk(true); break;
    }
    case 'lk-undo': LK.pts.pop(); lkTmp(); renderLk(); break;
    case 'lk-finish': lkFinish(); break;
    case 'lk-cancel': lkCancel(); renderLk(true); break;
    case 'lk-desel': LK.sel = null; renderLk(true); break;
    case 'lk-dup': lkDuplicate(); break;
    case 'lk-del': { const i = lkInc(); if (i) { i.drawings = i.drawings.filter((x) => x.id !== LK.sel); LK.sel = null; lkSave(); renderLk(true); } break; }
    case 'lk-export': openSheet('Lagekarte exportieren', `<div class="hint">ZIP mit drei GeoJSON-Dateien (Lagekarte_p Punkte, _l Linien, _f Flächen), EPSG:4326 / WGS84. Felder: Typ, Kategorie, Zeichen (Text im Zeichen), Titel, Info. Lässt sich in QGIS öffnen und hier wieder importieren.</div><button class="btn" data-act="lk-exp">Exportieren</button>`); break;
    case 'lk-exp': lkExport(); break;
    case 'ablage': openAblage(); break;
    case 'doc-open': openDoc(b.dataset.url, b.dataset.name); break;
    case 'foto-big': openSheet(b.dataset.cap || 'Foto', `<img class="photo-big" src="${esc(b.dataset.url)}" alt="${esc(b.dataset.cap || 'Foto')}">${b.dataset.cap ? `<div class="hint">${esc(b.dataset.cap)}</div>` : ''}<button class="btn sec" data-act="ablage">Zurück zur Ablage</button>`); break;
    case 'ul-rm': { const i = sim.incById($('#ulInc').value); const t = $('#ulText').value.trim(); if (!i || !t) { toast('Bitte Einsatz wählen und Text eingeben.'); break; } await api.rueckmeldung(i, t); $('#ulText').value = ''; toast('Rückmeldung eingespielt'); break; }
    case 'ul-foto': {
      const i = sim.incById($('#ulInc').value);
      if (!i || !UI.fotoData) { toast('Bitte zuerst ein Foto auswählen.'); break; }
      b.disabled = true;
      const ok = await api.photo(i, UI.fotoData, $('#fotoCap').value.trim());
      b.disabled = false;
      if (ok) { toast('Foto eingespielt'); UI.fotoData = null; $('#fotoFile').value = ''; $('#fotoCap').value = ''; $('#fotoPrev').hidden = true; }
      break;
    }
    case 'transporte': openTransports(); break;
    case 'em': openVehicle(b.dataset.vid); break;
    case 'vst': {
      const v = sim.byId(b.dataset.vid);
      if (!v || !CAN_LEAD) break;
      const r = await api.setStatus(v, b.dataset.st);
      if (r && r.ok) toast(`${v.name}: Status ${b.dataset.st} – ${STATUS_TEXT[b.dataset.st]}`); else if (r && r.error && !REMOTE) toast(r.error);
      render(true); openVehicle(v.id); break;
    }
    case 'veh': openVehicle(b.dataset.vid); break;
    case 'release': { const v = sim.byId(b.dataset.vid); if (v.incidentId) await api.release(v); closeSheet(); render(true); break; }
    case 'assign': { const i = sim.incById($('#vaInc').value); const v = sim.byId(b.dataset.vid); if (i && await api.request(i, v.kind === 'FFV' ? null : v.kind, v.id, v.le)) toast(`${v.name} angefordert`); closeSheet(); render(true); break; }
    case 'retry': {
      if (!inc) break;
      const k = b.dataset.kind;
      if (k.startsWith('EXT:')) break;
      if (await api.retry(inc, k)) toast(`${KIND_LABEL[k] || k} erneut angefordert`); else toast('Anforderung nicht möglich');
      render(true); break;
    }
    case 'nach': openNach(); break;
    case 'nach-frei': if (inc) {
      const name = ($('#nfName').value || '').trim();
      if (!name) { toast('Bitte eine Bezeichnung eingeben'); $('#nfName').focus(); break; }
      const anz = Math.max(1, Math.min(10, Math.round(+$('#nfAnz').value) || 1)), eta = Math.max(0, Math.min(240, Math.round(+$('#nfEta').value) || 0));
      let n = 0;
      for (let k = 1; k <= anz; k++) {
        const nm = anz > 1 ? `${name} ${k}` : name;
        if (await api.customAdd(inc, eta === 0 ? { name: nm, org: $('#nfOrg').value, stage: 3 } : { name: nm, org: $('#nfOrg').value, stage: 1, auto: true, eta })) n++;
      }
      toast(n ? `${n === 1 ? name : n + '× ' + name} alarmiert` : 'Nicht möglich – Einsatz läuft nicht');
      closeSheet(); render(true);
    } break;
    case 'nach-kind': if (inc) { const ok = await api.request(inc, b.dataset.kind); toast(ok ? `${KIND_LABEL[b.dataset.kind]} angefordert` : 'Anforderung nicht möglich'); closeSheet(); render(true); } break;
    case 'nach-le': if (inc) { const n = +$('#nachLE').value; const ok = await api.request(inc, 'LE', null, n); toast(ok ? `LE ${n} angefordert` : 'Anforderung nicht möglich'); closeSheet(); render(true); } break;
    case 'filter': UI.filter = b.dataset.f; render(true); break;
    case 'nach-veh': if (inc) { const v = sim.byId($('#nachVeh').value); if (await api.request(inc, v.kind, v.id, v.le)) toast(`${v.name} angefordert`); closeSheet(); render(true); } break;
    case 'erh': if (CAN_LEAD) openErh(); break;
    case 'erh-go': if (inc) { await api.erhoehen(inc, b.dataset.s); toast(`Alarmstufe auf ${b.dataset.s} erhöht`); closeSheet(); render(true); } break;
    case 'end': if (CAN_LEAD) { UI.confirmEnd = UI.sel; render(true); } break;
    case 'end-no': UI.confirmEnd = null; render(true); break;
    case 'end-yes': if (inc) await api.end(inc); UI.confirmEnd = null; render(true); break;
    case 'ni-mode': setNiMode(b.dataset.m); break;
    case 'ni-go': submitNew(); break;
    case 'rand-inc': { const k = sim.autoKey(b.dataset.w); closeSheet(); const i = await newIncident({ key: k, select: true }); if (i) toast(`${i.title} – ${i.addr.street}`); break; }
    case 'speed': await api.speed(+b.dataset.s); refreshUL(); render(true); break;
    case 'reset': UI.confirmReset = true; refreshUL(); break;
    case 'reset-no': UI.confirmReset = false; refreshUL(); break;
    case 'reset-yes':
      UI.confirmReset = false; await api.reset(); sim.lage.drawings = []; if (!REMOTE) api.lage([]); UI.sel = null; $('#lk').hidden = true; $('#ab').hidden = true;
      for (const m of [dMap, lMap]) if (m) { for (const [, x] of m.__inc) m.removeLayer(x); m.__inc.clear(); for (const [, x] of m.__veh) m.removeLayer(x); m.__veh.clear(); }
      // Einlagen: alle Haken zurück, Dialog zu
      EL.done = {}; EL.busy = null; UI.elPrep = null; try { await ELDB.set('done', {}); } catch (e) { console.error(e); }
      if (typeof renderEL === 'function') renderEL(true);
      refreshUL(); render(true); toast('Übung zurückgesetzt – Einlagen wieder offen'); break;
    case 'cfg-save':
      for (const k of ['karte', 'alkisUrl', 'alkisLayers', 'dopUrl', 'dopLayers']) MAPCFG[k] = $('#cfg_' + k).value.trim();
      store.set('fa-mapcfg', { karte: MAPCFG.karte, alkisUrl: MAPCFG.alkisUrl, alkisLayers: MAPCFG.alkisLayers, dopUrl: MAPCFG.dopUrl, dopLayers: MAPCFG.dopLayers });
      for (const m of [dMap, lMap]) if (m) m.__setLayer(m.__cur);
      toast('Kartendienste übernommen'); break;
    case 'ab-open': if (!inc) { toast('Bitte zuerst einen Einsatz auswählen.'); break; } $('#ab').hidden = false; UI.tapSel = null; renderAB(); break;
    case 'ab-close': $('#ab').hidden = true; $('#menu').hidden = true; render(true); break;
    case 'ab-menu': if ($('#menu').hidden) showMenu(); else $('#menu').hidden = true; break;
    case 'tpl':
      if (inc) {
        if (b.dataset.t === 'standard') { const left = inc.sections.left; inc.sections = sim.makeSections('standard'); inc.sections.left = left; }
        else sim.applyTemplate(inc.sections, b.dataset.t);
        api.sections(inc);
        api.log(inc, `Einsatzvorlage geladen: ${b.querySelector('b').textContent}`);
      }
      $('#menu').hidden = true; renderAB(); break;
    case 'sec-edit': openSecEdit(b.dataset.sid); break;
    case 'sec-add': if (inc) { const n = inc.sections.eas.reduce((m, x) => Math.max(m, +x.id.slice(2)), 0) + 1; inc.sections.eas.push({ id: 'EA' + n, label: `EA ${n}`, name: 'N.N.', rg: '', leader: null, vehicles: [], subs: [] }); api.sections(inc); renderAB(); setTimeout(() => ($('#abBoard').scrollTop = 1e6), 30); } break;
    case 'se-save': { const sl = slotById(inc.sections, b.dataset.sid); sl.name = $('#seName').value.trim() || 'N.N.'; sl.rg = $('#seRg').value.trim(); api.sections(inc); closeSheet(); renderAB(); break; }
    case 'se-sub': {
      const ea = slotById(inc.sections, b.dataset.sid);
      const n = ea.id.slice(2), k = ea.subs.length + 1;
      ea.subs.push({ id: `EUA${n}.${k}`, label: `EUA ${n}.${k}`, name: 'N.N.', rg: '', leader: null, vehicles: [] });
      api.sections(inc); closeSheet(); renderAB(); break;
    }
    case 'se-del': {
      const sid = b.dataset.sid, s = inc.sections;
      s.eas = s.eas.filter((x) => x.id !== sid);
      for (const x of s.eas) x.subs = x.subs.filter((u) => u.id !== sid);
      api.sections(inc); closeSheet(); renderAB(); break;
    }
  }
});

  if (id && id.startsWith('rmix_')) api.auto({ rd: { mix: { [id.slice(5)]: Math.max(0, +e.target.value || 0) } } });

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  const ae = document.activeElement;

/* ---------- Takt ---------- */
let lastT = performance.now();
// Takt über einen Hintergrund-Worker: Browser bremsen normale Timer in Hintergrund-Tabs stark aus
function startTicker(fn) {
  try {
    const w = new Worker(URL.createObjectURL(new Blob(['setInterval(function(){postMessage(0)},1000)'], { type: 'text/javascript' })));
    w.onmessage = fn;
    return;
  } catch (e) { /* z. B. lokal geöffnete Datei: normaler Timer */ }
  setInterval(fn, 1000);
}
startTicker(() => { tickOnce().catch((e) => console.error(e)); });
async function tickOnce() {
  const now = performance.now();
  const elapsed = now - lastT;
  const dt = Math.min(5000, elapsed);
  lastT = now;
  if (REMOTE) {
    // Gerät ohne Zentrale: nur die Uhr weiterlaufen lassen, der Stand kommt von der Zentrale
    if (!sim.paused) sim.now += dt * (sim.speed || 1);
    netWatch();
    render();
    return;
  }
  // Hing der Rechner (Ruhezustand, Hintergrund), wird die verpasste Zeit nachgeholt – die Uhr bleibt auf Echtzeit
  // Pause: Uhr, Fahrzeuge, RD-Last und automatische Einsätze stehen still
  if (!sim.paused) {
    if (elapsed > 6000) catchUp(elapsed); else sim.tick(dt);
    processPlan();
    if (sim.autoDue('fire', dt)) { UI.autoFlag = true; await newIncident({ key: sim.autoKey('fire') }); UI.autoFlag = false; }
    if (sim.autoDue('rd', dt)) { await newIncident({ key: sim.autoKey('rd') }); }
  }
  if (NET.host) {
    if (Date.now() - NET.lastPub >= 2000) publishSnap();
    if (Date.now() - NET.lastBeat >= 4000) beat();
    if (Date.now() - (NET.lastActPoll || 0) >= 2000) pollActions();
  }
  render();
}

/* ---------- Start: leer, ohne Beispiel-Einsätze ---------- */
(async function start() {
  setView('details');
  refineStations();
  if (!ONLINE) { render(true); return; }
  const s = await loadSnapFromDb();
  if (s) { applySnap(s); NET.lastSnap = Date.now(); }
  await connectNet();
  if (ROLE === 'leitung') await tryClaim(false);
  render(true);
})();
